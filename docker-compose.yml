version: '3.8'

services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      - THESTATSAPI_KEY=${THESTATSAPI_KEY}
      - THESTATSAPI_BASE_URL=https://api.thestatsapi.com/api
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped
